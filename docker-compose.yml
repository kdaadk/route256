version: "3.8"

x-postgres-common:
  &postgres-common
  image: postgres:16-alpine
  user: postgres
  restart: always
  healthcheck:
    test: 'pg_isready -U user --dbname=postgres'
    interval: 10s
    timeout: 5s
    retries: 5

services:
  cart:
    build:
      context: ./cart
      dockerfile: Dockerfile
    working_dir: /app
    command: ["./cartbuild"]
    depends_on:
      - loms

  loms:
    build:
      context: ./loms
      dockerfile: Dockerfile
    working_dir: /app
    command: ["./lomsbuild"]
    depends_on:
      - postgres_primary
      - postgres_replica
    environment:
      DB_MASTER_URL: "postgres://loms:loms@localhost:5432/loms?sslmode=disable"
      DB_REPLICA_URL: "postgres://loms:loms@localhost:5432/loms?sslmode=disable"

  postgres_primary:
    <<: *postgres-common
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: loms
      POSTGRES_DB: loms
      POSTGRES_PASSWORD: loms
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256\nhost replication all 0.0.0.0/0 md5"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: |
      postgres 
      -c wal_level=replica 
      -c hot_standby=on 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby_feedback=on
    volumes:
      - ./postgres/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql

  postgres_replica:
    <<: *postgres-common
    ports:
      - 5433:5432
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_password
    command: |
      bash -c "
      until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=postgres_primary --port=5432
      do
      echo 'Waiting for primary to connect...'
      sleep 1s
      done
      echo 'Backup done, starting replica...'
      chmod 0700 /var/lib/postgresql/data
      postgres
      "
    depends_on:
      - postgres_primary
